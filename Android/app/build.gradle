apply plugin: 'com.android.application'
apply plugin: 'org.sonarqube' // Apply SonarQube plugin correctly
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize' // Replaces kotlin-android-extensions

android {
    compileSdkVersion 34 // Updated to latest SDK

    defaultConfig {
        applicationId "io.github.project_travel_mate"
        minSdkVersion 22
        targetSdkVersion 34 // Updated
        versionCode 49
        versionName "5.6.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        disable 'InvalidPackage'
        abortOnError false
        absolutePaths false
        lintConfig file('lint.xml')
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Use AndroidX instead of Support Libraries
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'

    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.eftimoff:android-pathview:1.0.8@aar'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.patrickpissurno:ripple-effect:1.3.1'
    implementation 'org.osmdroid:osmdroid-android:6.1.11'
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.miguelcatalan:materialsearchview:1.4.0'
    implementation 'com.github.dmytrodanylyk.android-process-button:library:1.0.4'

    implementation 'com.jakewharton:butterknife:10.2.3'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.3'

    implementation "androidx.room:room-runtime:2.5.2"
    annotationProcessor "androidx.room:room-compiler:2.5.2"

    implementation 'com.cloudinary:cloudinary-android:1.24.0'
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    implementation 'com.airbnb.android:lottie:6.0.0'
    implementation 'io.github.tonnyl:whatsnew:0.1.1'

    // RxJava
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'androidx.room:room-rxjava2:2.5.2'

    //Lifecycle Components
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'

    implementation 'com.theartofdev.edmodo:android-image-cropper:2.8.0'
    implementation 'com.google.android:flexbox:3.0.0'
    implementation 'com.github.mukeshsolanki:android-otpview-pinview:2.0.0'
    implementation 'com.github.vipulasri:timelineview:1.0.6'

    //Graph view
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // World Country flag
    implementation 'com.github.blongho:world-country-data:v1.1.0'
}

sonarqube {
    properties {
        property "sonar.projectKey", "SilentPow_Travel-Mate"
        property "sonar.organization", "silentpow"
        property "sonar.host.url", "https://sonarcloud.io"
    }
}

// Ensure lint and checkstyle run before builds
preBuild.dependsOn('checkstyle')
assemble.dependsOn('lint')
check.dependsOn('checkstyle')
