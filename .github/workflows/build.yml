name: SonarQube
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'zulu' # Alternative distribution options are available
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/Android/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('./Android/**/*.gradle', './Android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Grant execute permissions for Gradlew
        run: chmod +x Android/gradlew
      - name: Configure Gradle properties
        run: mkdir -p ~/.gradle echo "systemProp.gradle.enterprise.buildScanTermsOfServiceAgreement=yes" >> ~/.gradle/gradle.properties
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./Android/gradlew build sonar --info